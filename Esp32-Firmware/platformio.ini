; SmartFind kiosk firmware — ESP32 DevKit V1 (30-pin)
;
;   pio run                     build
;   pio run -t upload           build + flash over USB
;   pio device monitor          serial log (115200 baud)
;
; Versions are pinned so a build next year gives the same firmware.

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; the default partition table leaves ~1.2 MB for the app — plenty, but TLS + WebServer
; make the binary large, so use the bigger "no OTA" layout
board_build.partitions = huge_app.csv

build_flags =
	-DCORE_DEBUG_LEVEL=1
	-DFIRMWARE_VERSION=\"1.0.0\"

lib_deps =
	bblanchon/ArduinoJson@7.4.2
	chris--a/Keypad@3.1.1
	marcoschwartz/LiquidCrystal_I2C@1.1.4
	adafruit/Adafruit PWM Servo Driver Library@3.0.2
